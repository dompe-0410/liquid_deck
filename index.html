<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Liquid Deck" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./時計.png" />
  <title>Liquid Deck</title>
  <style>
    :root {
      /* 見た目を調整する主要な設定です。 */
      --page-background: #f3f7fb;
      /* 背景の光。色・透明度・位置を調整できます。 */
      --page-glow-a: rgba(181, 229, 255, .62); /* 青 */
      --page-glow-b: rgba(222, 207, 255, .52); /* 紫 */
      --page-glow-c: rgba(218, 238, 157, .46); /* 黄緑 */
      --page-glow-blur: 28px; /* 小さくすると光の形が見えやすくなります。 */
      --page-glow-c-size: 24vw;
      --page-text: #111827;
      --muted-text: #111827;
      /* フォントと文字サイズはここでまとめて変更できます。 */
      --font-ui: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace;
      --font-size-clock: clamp(.7rem, 22cqw, 1.7rem); /* 時計の文字 */
      --font-size-weather-date: clamp(.55rem, 9cqw, .78rem); /* 天気の日付 */
      --icon-size: clamp(1.35rem, 34cqw, 4.2rem); /* 通常アイコン */
      --weather-icon-size: clamp(1.7rem, 34cqw, 4.2rem); /* 天気アイコン */
      --accent-color: #56bde9;
      /* 背面ディスプレイの調整はこの2つだけで行えます。 */
      --display-enabled: 0; /* 1 = 表示、0 = 非表示 */
      --display-opacity: .04; /* 0.0〜1.0。小さいほど透明です。 */
      --display-color: rgb(232 247 255 / var(--display-opacity));
      --display-line: rgb(255 255 255 / var(--display-opacity));
      --key-background: rgba(255, 255, 255, .38);
      --key-background-hover: rgba(255, 255, 255, .55);
      --key-border: rgba(255, 255, 255, .52); /* 細い枠線 */
      --key-radius: 6px; /* 小さめの角丸 */
      --key-blur: 2px;
      /* 透明キーの輪郭を見せるための控えめな影です。 */
      --key-shadow: 0 16px 24px rgba(89, 119, 142, .18), 0 4px 7px rgba(89, 119, 142, .10), inset 0 1px rgba(255,255,255,.9);
      --key-shadow-pressed: 0 5px 9px rgba(89, 119, 142, .12), inset 0 3px 9px rgba(117, 166, 188, .12);
      --key-side-height: 0px; /* キーキャップ下側の見える厚み */
      --key-side-color: rgba(111, 157, 177, .34);
      --key-tint: rgba(255, 255, 255, .04);
      --key-refraction: url(#liquid-glass-filter);
      --grid-gap: clamp(10px, 2.6vw, 20px);
    }

    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--page-text);
      font-family: var(--font-ui);
      /* 追加された画像を画面全体の背景に使います。 */
      /* 背景画像は使わず、下の光だけで明るい背景を作ります。 */
      background: var(--page-background);
    }

    body::before, body::after {
      position: fixed;
      z-index: 0;
      width: 48vw;
      height: 48vw;
      border-radius: 50%;
      content: "";
      filter: blur(var(--page-glow-blur));
      pointer-events: none;
    }
    body::before { top: -18vw; left: -12vw; background: var(--page-glow-a); }
    body::after { right: -15vw; bottom: -20vw; background: var(--page-glow-b); }
    /* 黄緑の光も青・紫と同じぼかしを使います。 */
    .ambient-lime {
      position: fixed;
      z-index: 0;
      top: 5vh;
      right: 6vw;
      width: var(--page-glow-c-size);
      height: var(--page-glow-c-size);
      border-radius: 50%;
      background: var(--page-glow-c);
      filter: blur(var(--page-glow-blur));
      pointer-events: none;
    }

    /* 画面の高さにも合わせ、PC・iPadで4×4全体を収めます。 */
    .deck { position: relative; z-index: 1; width: min(92vw, 760px, 82svh); max-height: 100svh; padding: clamp(12px, 3vw, 28px); }
    .deck-header { display: flex; align-items: end; justify-content: space-between; margin: 0 3px 22px; }
    .edit-toggle { display: flex; align-items: center; gap: 7px; color: #111827; font-size: .75rem; cursor: pointer; user-select: none; }
    .edit-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-track { position: relative; display: inline-block; width: 36px; height: 20px; border-radius: 999px; background: rgba(17,24,39,.18); transition: background .15s ease; }
    .toggle-track::after { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22); content: ""; transition: transform .15s ease; }
    .edit-toggle input:checked + .toggle-track { background: #111827; }
    .edit-toggle input:checked + .toggle-track::after { transform: translateX(16px); }
    h1 { margin: 0; color: #111827; font-size: clamp(1.35rem, 4vw, 2.3rem); font-weight: 650; letter-spacing: .06em; }
    .status { color: var(--muted-text); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }

    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--grid-gap); }
    .button {
      position: relative;
      /* ボタン自身の幅を、内部サイズ計算の基準にします。 */
      container-type: inline-size;
      /* どの画面幅でも必ず正方形を維持します。 */
      aspect-ratio: 1 / 1;
      min-width: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    .button.editable { cursor: grab; }
    .button.editable:active { cursor: grabbing; }
    .button.dragging { z-index: 10; opacity: .45; transform: scale(.96); }
    .button.drop-target .cap { outline: 2px dashed rgba(17,24,39,.55); outline-offset: 4px; }
    .display {
      position: absolute;
      inset: 6px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      overflow: hidden;
      border: 1px solid var(--display-line);
      border-radius: calc(var(--key-radius) - 4px);
      opacity: var(--display-enabled);
      background: linear-gradient(145deg, rgb(255 255 255 / var(--display-opacity)), var(--display-color));
      box-shadow: inset 0 0 18px rgba(255,255,255,.42), inset 0 -8px 18px rgba(108, 188, 219, .08);
    }
    .display::after { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.42), transparent 42%); content: ""; pointer-events: none; }
    .cap {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 10px;
      border: 1px solid var(--key-border);
      border-bottom: 1px solid var(--key-side-color);
      border-radius: var(--key-radius);
      background-color: var(--key-tint);
      /* 上面の反射だけを残し、本体はできるだけ透明にします。 */
      background-image: linear-gradient(145deg, rgba(255,255,255,.32), rgba(255,255,255,.025) 46%, rgba(255,255,255,.16));
      /* 下辺の内側陰影で、透明キーの厚みを表現します。 */
      box-shadow: var(--key-shadow), inset 0 1px 1px rgba(255,255,255,.76), inset 0 calc(var(--key-side-height) * -1) var(--key-side-height) var(--key-side-color);
      backdrop-filter: blur(var(--key-blur)) saturate(1.35) var(--key-refraction);
      -webkit-backdrop-filter: blur(var(--key-blur)) saturate(1.35) var(--key-refraction);
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    /* 背面ディスプレイをキーキャップの下に表示します。 */
    .display { display: grid; }
    .button:hover .cap { background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); border-color: #fff; }
    .button:active .cap { transform: translateY(var(--key-side-height)) scale(.975); box-shadow: var(--key-shadow-pressed); }
    .button:focus-visible .cap { outline: 3px solid rgba(86,189,233,.38); outline-offset: 4px; }
    /* 画像や文字ではなく、常にボタン本体がドラッグを受け取ります。 */
    .cap, .cap * { pointer-events: none; }
    .icon { position: relative; z-index: 2; color: #111827; font-size: clamp(1.25rem, 5vw, 2.15rem); line-height: 1; }
    .icon-image { position: relative; z-index: 2; display: block; width: var(--icon-size); height: var(--icon-size); object-fit: contain; opacity: .88; }
    /* Stream Deck風に、通常ボタンのラベルは表示しません。 */
    .label { display: none; }
    .value { position: relative; z-index: 2; color: #111827; font-size: var(--font-size-clock); font-weight: 650; font-variant-numeric: tabular-nums; }
    .weather-date { position: relative; z-index: 2; color: #111827; font-size: var(--font-size-weather-date); font-weight: 650; }
    .weather-icon { position: relative; z-index: 2; width: var(--weather-icon-size); height: var(--weather-icon-size); object-fit: contain; }
    .weather-cap { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .qr-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 20px; background: rgba(17,24,39,.24); backdrop-filter: blur(8px); }
    .qr-modal.open { display: grid; }
    .qr-card { width: min(92vw, 360px); padding: 22px; border: 1px solid rgba(255,255,255,.7); border-radius: 16px; background: rgba(255,255,255,.82); color: #111827; box-shadow: 0 18px 50px rgba(0,0,0,.2); }
    .qr-card h2 { margin: 0 0 14px; font-size: 1rem; }
    .qr-input { width: 100%; min-height: 74px; resize: vertical; padding: 10px; border: 1px solid rgba(17,24,39,.22); border-radius: 8px; background: rgba(255,255,255,.75); color: #111827; font: inherit; }
    .qr-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .qr-actions button { padding: 8px 12px; border: 1px solid rgba(17,24,39,.22); border-radius: 8px; background: rgba(255,255,255,.8); color: #111827; cursor: pointer; font: inherit; }
    #qr-output { display: grid; place-items: center; min-height: 180px; margin-top: 14px; }
    .empty .display { background: rgb(255 255 255 / var(--display-opacity)); box-shadow: inset 0 0 14px rgb(255 255 255 / var(--display-opacity)); }
    .empty .cap { background: rgba(255,255,255,.12); opacity: .82; }

    @media (max-width: 420px) { .deck { width: 96vw; padding: 12px; } .deck-header { margin-bottom: 16px; } }
    @media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
  </style>
</head>
<body>
  <div class="ambient-lime" aria-hidden="true"></div>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="liquid-glass-filter" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <main class="deck">
    <header class="deck-header"><h1>Liquid Deck</h1><label class="edit-toggle"><input id="edit-mode" type="checkbox"><span class="toggle-track" aria-hidden="true"></span><span>edit</span></label></header>
    <section class="grid" aria-label="Liquid Deck buttons">
      <button class="button" aria-label="時計"><span class="display"></span><span class="cap"><span class="value" id="clock">--:--</span></span></button>
      <button class="button" data-key="weather" aria-label="天気"><span class="display"></span><span class="cap weather-cap"><img class="weather-icon" src="./天気.png" alt="天気"><span class="weather-date" id="weather-date">--/--</span></span></button>
      <button class="button" data-action="qr" aria-label="QR作成"><span class="display"></span><span class="cap"><img class="icon-image" src="./QR.png" alt="QR作成"><span class="label">QR作成</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><img class="icon-image" src="./リンク.png" alt="サイト"><span class="label">サイト</span></span></button>
      <button class="button" aria-label="カレンダー"><span class="display"></span><span class="cap"><img class="icon-image" src="./カレンダー.png" alt="カレンダー"></span></button>
      <button class="button"><span class="display"></span><span class="cap"><img class="icon-image" src="./スピード.png" alt="速度テスト"><span class="label">速度テスト</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><img class="icon-image" src="./後で見る.png" alt="後で見る"><span class="label">後で見る</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><img class="icon-image" src="./設定.png" alt="設定"><span class="label">設定</span></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
    </section>
  </main>
  <div class="qr-modal" id="qr-modal" aria-hidden="true">
    <section class="qr-card" role="dialog" aria-modal="true" aria-labelledby="qr-title">
      <h2 id="qr-title">QR作成</h2>
      <textarea class="qr-input" id="qr-input" placeholder="URLや文字を入力"></textarea>
      <div class="qr-actions"><button type="button" id="qr-close">閉じる</button><button type="button" id="qr-generate">生成</button></div>
      <div id="qr-output"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const clock = document.querySelector('#clock');
    const weatherDate = document.querySelector('#weather-date');
    const grid = document.querySelector('.grid');
    const editMode = document.querySelector('#edit-mode');
    const updateClock = () => {
      const now = new Date();
      clock.textContent = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(now);
      weatherDate.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }).format(now);
    };
    updateClock();
    setInterval(updateClock, 1000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const qrModal = document.querySelector('#qr-modal');
    const qrInput = document.querySelector('#qr-input');
    const qrOutput = document.querySelector('#qr-output');
    const openQr = () => { qrModal.classList.add('open'); qrModal.setAttribute('aria-hidden', 'false'); qrInput.focus(); };
    const closeQr = () => { qrModal.classList.remove('open'); qrModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('[data-action="qr"]').addEventListener('click', openQr);
    document.querySelector('#qr-close').addEventListener('click', closeQr);
    document.querySelector('#qr-generate').addEventListener('click', () => {
      const text = qrInput.value.trim();
      qrOutput.replaceChildren();
      if (!text || typeof QRCode === 'undefined') return;
      new QRCode(qrOutput, { text, width: 180, height: 180, colorDark: '#111827', colorLight: '#ffffff' });
    });
    qrModal.addEventListener('click', (event) => { if (event.target === qrModal) closeQr(); });

    // 編集モードで並べ替えた順番を保存します。
    const buttons = [...grid.querySelectorAll('.button')];
    buttons.forEach((button, index) => { button.dataset.slot = String(index); });
    const savedOrder = JSON.parse(localStorage.getItem('liquid-deck-order') || 'null');
    if (Array.isArray(savedOrder)) {
      savedOrder.forEach((slot) => {
        const button = buttons.find((item) => item.dataset.slot === slot);
        if (button) grid.appendChild(button);
      });
    }

    let draggedButton = null;
    let dragStartX = 0;
    let dragStartY = 0;
    editMode.addEventListener('change', () => {
      grid.querySelectorAll('.button').forEach((button) => button.classList.toggle('editable', editMode.checked));
    });
    grid.addEventListener('pointerdown', (event) => {
      if (!editMode.checked) return;
      const button = event.target.closest('.button');
      if (!button) return;
      event.preventDefault();
      draggedButton = button;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      draggedButton.classList.add('dragging');
      draggedButton.setPointerCapture(event.pointerId);
    });
    grid.addEventListener('pointermove', (event) => {
      if (!draggedButton) return;
      const x = event.clientX - dragStartX;
      const y = event.clientY - dragStartY;
      draggedButton.style.transform = `translate(${x}px, ${y}px) scale(.96)`;
    });
    grid.addEventListener('pointerup', (event) => {
      if (!draggedButton) return;
      const target = document.elementsFromPoint(event.clientX, event.clientY)
        .map((element) => element.closest('.button'))
        .find((button) => button && button !== draggedButton && button.parentElement === grid);
      if (target && target !== draggedButton && target.parentElement === grid) {
        // ドロップ先と掴んだボタンの2つだけを直接交換します。
        const placeholder = document.createElement('span');
        placeholder.hidden = true;
        grid.replaceChild(placeholder, draggedButton);
        grid.replaceChild(draggedButton, target);
        grid.replaceChild(target, placeholder);
        localStorage.setItem('liquid-deck-order', JSON.stringify([...grid.children].map((item) => item.dataset.slot)));
      }
      draggedButton.classList.remove('dragging');
      draggedButton.style.transform = '';
      draggedButton.releasePointerCapture?.(event.pointerId);
      draggedButton = null;
    });
    const cancelDrag = () => {
      if (!draggedButton) return;
      draggedButton.classList.remove('dragging');
      draggedButton.style.transform = '';
      draggedButton = null;
    };
    grid.addEventListener('pointercancel', cancelDrag);
    grid.addEventListener('lostpointercapture', cancelDrag);
  </script>
</body>
</html>
