<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Liquid Deck" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./時計.png" />
  <title>Liquid Deck</title>
  <style>
    :root {
      /* 見た目を調整する主要な設定です。 */
      --page-background: #f3f7fb;
      --page-background-dark: #11141b; /* ダークモードの背景色 */
      /* 背景の光。色・透明度・位置を調整できます。 */
      --page-glow-a: rgba(181, 229, 255, .62); /* 青 */
      --page-glow-b: rgba(222, 207, 255, .52); /* 紫 */
      --page-glow-c: rgba(218, 238, 157, .46); /* 黄緑 */
      --page-glow-blur: 28px; /* 小さくすると光の形が見えやすくなります。 */
      --page-glow-c-size: 24vw;
      --page-text: #111827;
      --muted-text: #111827;
      /* フォントと文字サイズはここでまとめて変更できます。 */
      --font-ui: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace;
      --font-size-clock: clamp(.7rem, 22cqw, 1.7rem); /* 時計の文字 */
      --font-size-weather-date: clamp(.6rem, 11cqw, 1.0rem); /* 天気の日付 */
      /* 以下の文字サイズを変えると、画面の各文字を個別に調整できます。 */
      --font-size-title: clamp(1.2rem, 6vw, 1.7rem); /* Liquid Deck */
      --font-size-edit: .75rem; /* edit */
      --font-size-button: clamp(1.25rem, 5vw, 2.15rem); /* ボタン内の文字・アイコン基準 */
      --font-size-button-info: clamp(.45rem, 10cqw, 1.4rem); /* 天気・カレンダーの補助文字 */
      --font-size-dialog: .85rem; /* ダイアログ本文・入力欄 */
      --font-size-dialog-heading: 1rem; /* ダイアログ見出し */
      --font-size-dialog-note: .72rem; /* ダイアログ補足説明 */
      --icon-size: clamp(1.35rem, 34cqw, 4.2rem); /* 通常アイコン */
      --weather-icon-size: clamp(1.3rem, 34cqw, 4.2rem); /* 天気アイコン */
      --accent-color: #56bde9;
      /* 背面ディスプレイの調整はこの2つだけで行えます。 */
      --display-enabled: 0; /* 1 = 表示、0 = 非表示 */
      --display-opacity: .04; /* 0.0〜1.0。小さいほど透明です。 */
      --display-color: rgb(232 247 255 / var(--display-opacity));
      --display-line: rgb(255 255 255 / var(--display-opacity));
      --key-background: rgba(255, 255, 255, .38);
      --key-background-hover: rgba(255, 255, 255, .55);
      --key-border: rgba(255, 255, 255, .52); /* 細い枠線 */
      --key-radius: 6px; /* 小さめの角丸 */
      --key-blur: 2px;
      /* 透明キーの輪郭を見せるための控えめな影です。 */
      --key-shadow: 0 16px 24px rgba(89, 119, 142, .18), 0 4px 7px rgba(89, 119, 142, .10), inset 0 1px rgba(255,255,255,.9);
      --key-shadow-pressed: 0 5px 9px rgba(89, 119, 142, .12), inset 0 3px 9px rgba(117, 166, 188, .12);
      --key-side-height: 0px; /* キーキャップ下側の見える厚み */
      /* ダイアログの透明度。0に近いほど透明、1に近いほど不透明です。 */
      --dialog-opacity: .3;
      --key-side-color: rgba(111, 157, 177, .34);
      --key-tint: rgba(255, 255, 255, .04);
      --key-refraction: url(#liquid-glass-filter);
      --grid-gap: clamp(10px, 2.6vw, 20px);
    }

    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--page-text);
      font-family: var(--font-ui);
      /* 追加された画像を画面全体の背景に使います。 */
      /* 背景画像は使わず、下の光だけで明るい背景を作ります。 */
      background: var(--page-background);
    }
    /* ダークモードでもキーキャップ・ガラス部分の設定は変更しません。 */
    body.dark-mode { background: var(--page-background-dark); }
    body.dark-mode::before { opacity: .24; }
    body.dark-mode::after { opacity: .18; }
    /* ダークモードでは黒系アイコンだけを明るくして見やすくします。カラーアイコン・天気アイコンは変更しません。 */
    body.dark-mode .icon-image[alt="サイト"],
    body.dark-mode .icon-image[alt="X"],
    body.dark-mode .icon-image[alt="QR作成"],
    body.dark-mode .icon-image[alt="カレンダー"],
    body.dark-mode .icon-image[alt="速度テスト"],
    body.dark-mode .icon-image[alt="後で見る"],
    body.dark-mode .icon-image[alt="設定"] { filter: invert(1) brightness(.92); }
    body.dark-mode .clock-value,
    body.dark-mode .weather-date,
    body.dark-mode .weather-temp,
    body.dark-mode .calendar-date,
    body.dark-mode .calendar-time,
    body.dark-mode .calendar-event { color: #f3f4f6; }

    body::before, body::after {
      position: fixed;
      z-index: 0;
      width: 48vw;
      height: 48vw;
      border-radius: 50%;
      content: "";
      filter: blur(var(--page-glow-blur));
      pointer-events: none;
    }
    body::before { top: -18vw; left: -12vw; background: var(--page-glow-a); }
    body::after { right: -15vw; bottom: -20vw; background: var(--page-glow-b); }
    /* 黄緑の光も青・紫と同じぼかしを使います。 */
    .ambient-lime {
      position: fixed;
      z-index: 0;
      top: 5vh;
      right: 6vw;
      width: var(--page-glow-c-size);
      height: var(--page-glow-c-size);
      border-radius: 50%;
      background: var(--page-glow-c);
      filter: blur(var(--page-glow-blur));
      pointer-events: none;
    }

    /* 画面の高さにも合わせ、PC・iPadで4×4全体を収めます。 */
    .deck { position: relative; z-index: 1; width: min(92vw, 760px, 82svh); max-height: 100svh; padding: clamp(12px, 3vw, 28px); }
    .deck-header { display: flex; align-items: end; justify-content: space-between; margin: 0 3px 22px; }
    .edit-toggle { display: flex; align-items: center; gap: 7px; color: #111827; font-size: var(--font-size-edit); cursor: pointer; user-select: none; }
    .edit-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-track { position: relative; display: inline-block; width: 36px; height: 20px; border-radius: 999px; background: rgba(17,24,39,.18); transition: background .15s ease; }
    .toggle-track::after { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22); content: ""; transition: transform .15s ease; }
    .edit-toggle input:checked + .toggle-track { background: #111827; }
    .auth-button { padding: 5px 9px; border: 1px solid rgba(17,24,39,.2); border-radius: 999px; background: rgba(255,255,255,.45); color: #111827; cursor: pointer; font: inherit; font-size: .7rem; }
    .edit-toggle input:checked + .toggle-track::after { transform: translateX(16px); }
    h1 { margin: 0; color: #111827; font-size: var(--font-size-title); font-weight: 650; letter-spacing: .06em; }
    .status { color: var(--muted-text); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }

    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--grid-gap); }
    .button {
      position: relative;
      /* ボタン自身の幅を、内部サイズ計算の基準にします。 */
      container-type: inline-size;
      /* どの画面幅でも必ず正方形を維持します。 */
      aspect-ratio: 1 / 1;
      min-width: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    .button.editable { cursor: grab; }
    .button.editable:active { cursor: grabbing; }
    .button.dragging { z-index: 10; opacity: .45; transform: scale(.96); }
    .button.drop-target .cap { outline: 2px dashed rgba(17,24,39,.55); outline-offset: 4px; }
    .display {
      position: absolute;
      inset: 6px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      overflow: hidden;
      border: 1px solid var(--display-line);
      border-radius: calc(var(--key-radius) - 4px);
      opacity: var(--display-enabled);
      background: linear-gradient(145deg, rgb(255 255 255 / var(--display-opacity)), var(--display-color));
      box-shadow: inset 0 0 18px rgba(255,255,255,.42), inset 0 -8px 18px rgba(108, 188, 219, .08);
    }
    .display::after { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.42), transparent 42%); content: ""; pointer-events: none; }
    .cap {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 10px;
      border: 1px solid var(--key-border);
      border-bottom: 1px solid var(--key-side-color);
      border-radius: var(--key-radius);
      background-color: var(--key-tint);
      /* 上面の反射だけを残し、本体はできるだけ透明にします。 */
      background-image: linear-gradient(145deg, rgba(255,255,255,.32), rgba(255,255,255,.025) 46%, rgba(255,255,255,.16));
      /* 下辺の内側陰影で、透明キーの厚みを表現します。 */
      box-shadow: var(--key-shadow), inset 0 1px 1px rgba(255,255,255,.76), inset 0 calc(var(--key-side-height) * -1) var(--key-side-height) var(--key-side-color);
      backdrop-filter: blur(var(--key-blur)) saturate(1.35) var(--key-refraction);
      -webkit-backdrop-filter: blur(var(--key-blur)) saturate(1.35) var(--key-refraction);
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    /* 背面ディスプレイをキーキャップの下に表示します。 */
    .display { display: grid; }
    .button:hover .cap { background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); border-color: #fff; }
    .button:active .cap { transform: translateY(var(--key-side-height)) scale(.975); box-shadow: var(--key-shadow-pressed); }
    .button:focus-visible .cap { outline: 3px solid rgba(86,189,233,.38); outline-offset: 4px; }
    /* 画像や文字ではなく、常にボタン本体がドラッグを受け取ります。 */
    .cap, .cap * { pointer-events: none; }
    .icon { position: relative; z-index: 2; color: #111827; font-size: var(--font-size-button); line-height: 1; }
    /* 画像ファイル内の余白差を補正し、実際の絵の大きさを揃えます。 */
    .icon-image { --icon-scale: 1.16; position: relative; z-index: 2; display: block; width: var(--icon-size); height: var(--icon-size); object-fit: contain; opacity: .88; transform: scale(var(--icon-scale)); }
    .icon-image[alt="QR作成"] { --icon-scale: 1.08; }
    .icon-image[alt="カレンダー"] { --icon-scale: 1.08; }
    .icon-image[alt="速度テスト"] { --icon-scale: 1.12; }
    .icon-image[alt="後で見る"] { --icon-scale: 1.24; }
    .icon-image[alt="設定"] { --icon-scale: 1.12; }
    /* 固定サイトショートカット5個は、通常アイコンの1.3倍で表示します。 */
    .static-link .icon-image { --icon-scale: 1; width: calc(var(--icon-size) * 1.3); height: calc(var(--icon-size) * 1.3); }
    /* Stream Deck風に、通常ボタンのラベルは表示しません。 */
    .label { display: none; }
    .clock-value { position: relative; z-index: 2; display: inline-flex; align-items: baseline; gap: .18em; transform: translateX(2%); color: #111827; font-size: var(--font-size-clock); font-weight: 650; font-variant-numeric: tabular-nums; }
    .ampm { font-size: .5em; font-weight: 700; letter-spacing: .02em; }
    .weather-date { position: relative; z-index: 2; color: #111827; font-size: var(--font-size-weather-date); font-weight: 650; }
    .weather-temp { position: relative; z-index: 2; color: #111827; font-size: var(--font-size-button-info); font-weight: 650; }
    .weather-icon { position: relative; z-index: 2; width: var(--weather-icon-size); height: var(--weather-icon-size); object-fit: contain; }
    .weather-cap { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1px; }
    .weather-cap .weather-icon { transform: translateY(3px); margin-bottom: 3px; }
    /* ダイアログ表示中もホーム背景を暗くしません。ぼかしもほぼ無しです。 */
    .qr-modal, .weather-modal, .speed-modal, .settings-modal, .link-modal { background: transparent; backdrop-filter: none; }
    .qr-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px; }
    .qr-modal.open { display: grid; }
    .qr-card, .weather-card, .speed-card, .settings-card, .link-card { position: relative; font-size: var(--font-size-dialog); border: 1px solid rgba(255,255,255,.62); background: linear-gradient(145deg, rgb(255 255 255 / var(--dialog-opacity)), rgb(255 255 255 / calc(var(--dialog-opacity) * .55))); box-shadow: 0 18px 50px rgba(63,78,102,.18), inset 0 1px 0 rgba(255, 255, 255, 0.55); backdrop-filter: blur(5px) saturate(115%); }
    .qr-card { width: min(92vw, 380px); max-height: 88svh; overflow: auto; padding: 30px; border-radius: 20px; color: #111827; }
    .weather-close, .speed-close, .settings-close, .link-close { position: absolute; top: 18px; right: 18px; float: none; }
    .qr-card h2 { margin: 0 0 22px; font-size: var(--font-size-dialog-heading); text-align: center; }
    .qr-input { width: 100%; min-height: 74px; resize: vertical; padding: 10px; border: 1px solid rgba(17,24,39,.22); border-radius: 8px; background: rgba(255,255,255,.75); color: #111827; font: inherit; }
    .qr-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
    .qr-actions button { padding: 8px 12px; border: 1px solid rgba(17,24,39,.22); border-radius: 8px; background: rgba(255,255,255,.8); color: #111827; cursor: pointer; font: inherit; }
    #qr-output { display: grid; place-items: center; min-height: 180px; margin-top: 14px; }
    .weather-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px; }
    .weather-modal.open { display: grid; }
    .weather-card { width: min(92vw, 360px); padding: 30px; border-radius: 20px; color: #111827; }
    .weather-card h2 { margin: 0 0 22px; font-size: var(--font-size-dialog-heading); text-align: center; }
    .weather-input { width: 100%; padding: 10px; border: 1px solid rgba(17,24,39,.22); border-radius: 8px; background: rgba(255,255,255,.75); color: #111827; font: inherit; }
    .weather-results { display: grid; gap: 6px; margin-top: 10px; }
    .weather-result { padding: 9px; border: 1px solid rgba(17,24,39,.14); border-radius: 8px; background: rgba(255,255,255,.7); color: #111827; text-align: left; cursor: pointer; font: inherit; }
    .weather-close { float: right; padding: 5px 9px; border: 1px solid rgba(17,24,39,.18); border-radius: 8px; background: transparent; cursor: pointer; }
    .speed-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px; }
    .speed-modal.open { display: grid; }
    .speed-card { width: min(92vw, 380px); padding: 30px; border-radius: 20px; color: #111827; }
    .speed-card h2 { margin: 0 0 22px; font-size: var(--font-size-dialog-heading); text-align: center; }
    .speed-close { float: right; padding: 5px 9px; border: 1px solid rgba(17,24,39,.18); border-radius: 8px; background: transparent; cursor: pointer; }
    .speed-start { width: 100%; padding: 10px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); cursor: pointer; font: inherit; }
    .speed-status { min-height: 1.4em; margin: 12px 0; color: #374151; font-size: .85rem; }
    .speed-results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .speed-result { padding: 10px; border-radius: 8px; background: rgba(17,24,39,.06); text-align: center; }
    .speed-result strong { display: block; font-size: 1.05rem; }
    .settings-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px; }
    .settings-modal.open { display: grid; }
    .settings-card { width: min(92vw, 380px); max-height: 88svh; overflow: auto; padding: 30px; border-radius: 20px; color: #111827; }
    .settings-card h2 { margin: 0 0 22px; font-size: var(--font-size-dialog-heading); text-align: center; }
    .settings-close { float: right; padding: 5px 9px; border: 1px solid rgba(17,24,39,.18); border-radius: 8px; background: transparent; cursor: pointer; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 17px 0; border-bottom: 1px solid rgba(17,24,39,.1); font-size: .85rem; }
    .setting-row button, .setting-row select { padding: 6px 9px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); color: #111827; font: inherit; }
    .setting-wide { display: grid; gap: 12px; padding: 18px 0; border-bottom: 1px solid rgba(17,24,39,.1); font-size: .85rem; text-align: center; }
    .setting-wide input { width: 100%; padding: 7px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); color: #111827; font: inherit; }
    .setting-wide button { padding: 7px 9px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); color: #111827; cursor: pointer; font: inherit; }
    .setting-note { color: #4b5563; font-size: var(--font-size-dialog-note); }
    .link-modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px; }
    .link-modal.open { display: grid; }
    .link-card { width: min(92vw, 440px); max-height: 88svh; overflow: auto; padding: 30px; border-radius: 20px; color: #111827; }
    .link-card h2 { margin: 0 0 22px; font-size: var(--font-size-dialog-heading); text-align: center; }
    .link-close { float: right; padding: 5px 9px; border: 1px solid rgba(17,24,39,.18); border-radius: 8px; background: transparent; cursor: pointer; }
    .link-form { display: grid; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid rgba(17,24,39,.1); text-align: center; }
    .link-form input { width: 100%; padding: 8px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); color: #111827; font: inherit; }
    .link-form button { padding: 8px; border: 1px solid rgba(17,24,39,.2); border-radius: 8px; background: rgba(255,255,255,.7); cursor: pointer; font: inherit; }
    .link-list { display: grid; gap: 8px; margin-top: 14px; }
    .saved-link { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-width: 0; padding: 8px; border: 1px solid rgba(17,24,39,.12); border-radius: 9px; background: rgba(255,255,255,.56); }
    .saved-link img { width: 28px; height: 28px; object-fit: contain; }
    .saved-link > div { min-width: 0; overflow: hidden; }
    .saved-link a { display: block; min-width: 0; overflow: hidden; color: #111827; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    .saved-link small { display: block; min-width: 0; overflow: hidden; color: #6b7280; text-overflow: ellipsis; white-space: nowrap; }
    .saved-link button { padding: 4px 7px; border: 1px solid rgba(17,24,39,.16); border-radius: 7px; background: transparent; cursor: pointer; }
    .link-empty { color: #6b7280; font-size: .85rem; }
    .calendar-cap { display: grid; align-content: center; gap: 3px; padding: 8%; text-align: center; }
    .calendar-date, .calendar-time, .calendar-event { font-size: var(--font-size-button-info); font-weight: 600; }
    .calendar-event { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty .display { background: rgb(255 255 255 / var(--display-opacity)); box-shadow: inset 0 0 14px rgb(255 255 255 / var(--display-opacity)); }
    .empty .cap { background: rgba(255,255,255,.12); opacity: .82; }

    @media (max-width: 420px) { .deck { width: 96vw; padding: 12px; } .deck-header { margin-bottom: 16px; } }
    @media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
  </style>
</head>
<body>
  <div class="ambient-lime" aria-hidden="true"></div>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="liquid-glass-filter" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <main class="deck">
    <header class="deck-header"><h1>Liquid Deck</h1><div style="display:flex;align-items:center;gap:10px"><label class="edit-toggle"><input id="edit-mode" type="checkbox"><span class="toggle-track" aria-hidden="true"></span><span>edit</span></label></div></header>
    <section class="grid" aria-label="Liquid Deck buttons">
      <button class="button" aria-label="時計"><span class="display"></span><span class="cap"><span class="clock-value"><span id="clock">--:--</span><span class="ampm" id="ampm"></span></span></span></button>
      <button class="button" data-action="weather" aria-label="天気"><span class="display"></span><span class="cap weather-cap"><img class="weather-icon" id="weather-icon" src="./assets/weather/clear-day.png" alt="天気"><span class="weather-date" id="weather-date">--/--</span><span class="weather-temp" id="weather-temp">--℃</span></span></button>
      <button class="button" data-action="qr" aria-label="QR作成"><span class="display"></span><span class="cap"><img class="icon-image" src="./QR.png" alt="QR作成"><span class="label">QR作成</span></span></button>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const clock = document.querySelector('#clock');
    const ampm = document.querySelector('#ampm');
    const weatherDate = document.querySelector('#weather-date');
    const grid = document.querySelector('.grid');
    const editMode = document.querySelector('#edit-mode');
    let clockFormat = localStorage.getItem('liquid-deck-clock-format') || '24';
    let weatherRefreshMinutes = Number(localStorage.getItem('liquid-deck-weather-interval') || '10');
    let darkMode = localStorage.getItem('liquid-deck-dark-mode') === '1';
    let weatherRefreshTimer;
    const updateClock = () => {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', hour12: clockFormat === '12' }).formatToParts(now);
      clock.textContent = `${parts.find((part) => part.type === 'hour').value}:${parts.find((part) => part.type === 'minute').value}`;
      ampm.textContent = clockFormat === '12' ? parts.find((part) => part.type === 'dayPeriod')?.value || '' : '';
      weatherDate.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }).format(now);
    };
    updateClock();
    document.body.classList.toggle('dark-mode', darkMode);
    setInterval(updateClock, 1000);
    // 古いService Workerを解除し、端末ごとの古いキャッシュを残さないようにします。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => registrations.forEach((registration) => registration.unregister()));
    }
    if ('caches' in window) {
      caches.keys().then((keys) => keys.filter((key) => key.startsWith('liquid-deck-')).forEach((key) => caches.delete(key)));
    }

    const qrModal = document.querySelector('#qr-modal');
    const qrInput = document.querySelector('#qr-input');
    const qrOutput = document.querySelector('#qr-output');
    const openQr = () => { qrModal.classList.add('open'); qrModal.setAttribute('aria-hidden', 'false'); qrInput.focus(); };
    const closeQr = () => { qrModal.classList.remove('open'); qrModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('[data-action="qr"]').addEventListener('click', openQr);
    // 固定ショートカット。URLを変える場合はHTMLのdata-static-urlだけ編集します。
    document.querySelectorAll('.static-link').forEach((button) => {
      button.addEventListener('click', () => { if (!editMode.checked) window.open(button.dataset.staticUrl, '_blank', 'noopener'); });
    });
    document.querySelector('#qr-close').addEventListener('click', closeQr);
    document.querySelector('#qr-generate').addEventListener('click', () => {
      const text = qrInput.value.trim();
      qrOutput.replaceChildren();
      if (!text || typeof QRCode === 'undefined') return;
      new QRCode(qrOutput, { text, width: 180, height: 180, colorDark: '#111827', colorLight: '#ffffff' });
    });
    qrModal.addEventListener('click', (event) => { if (event.target === qrModal) closeQr(); });
    qrInput.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.querySelector('#qr-generate').click(); } });

    // 天気はページ更新時に東京都へ戻り、選択した地域は保存しません。
    const weatherIcon = document.querySelector('#weather-icon');
    const weatherTemp = document.querySelector('#weather-temp');
    const weatherModal = document.querySelector('#weather-modal');
    const weatherInput = document.querySelector('#weather-input');
    const weatherResults = document.querySelector('#weather-results');
    const weatherTitle = document.querySelector('#weather-title');
    const authButton = document.querySelector('#auth-button');
    const supabaseClient = window.supabase?.createClient(
      'https://mmxyzwydhewswlfpragp.supabase.co',
      'sb_publishable_TWHw1Fc_r1OLBNUW47O0-w_fCxcC68S'
    );
    const defaultWeatherLocation = { name: '東京都', latitude: 35.6762, longitude: 139.6503 };
    let weatherLocation = JSON.parse(localStorage.getItem('liquid-deck-weather-location') || 'null') || defaultWeatherLocation;
    let currentUser = null;
    let savedLinks = JSON.parse(localStorage.getItem('liquid-deck-saved-links') || '[]');
    let laterLinks = JSON.parse(localStorage.getItem('liquid-deck-later-links') || '[]');
    let calendarUrl = localStorage.getItem('liquid-deck-calendar-url') || '';
    let calendarCache = JSON.parse(localStorage.getItem('liquid-deck-calendar-cache') || 'null');
    let syncedLayoutOrder = null;
    const applyLayoutOrder = (order) => {
      if (!Array.isArray(order)) return;
      const items = [...grid.children];
      order.forEach((slot) => {
        const button = items.find((item) => item.dataset.slot === slot);
        if (button) grid.appendChild(button);
      });
    };
    const hostedAppUrl = 'https://dompe-0410.github.io/liquid_deck/';
    const updateAuthButton = (session) => {
      currentUser = session?.user || null;
      authButton.textContent = currentUser ? 'logout' : 'login';
    };

    const loadSyncedWeatherLocation = async () => {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      updateAuthButton(session);
      if (!currentUser) return;
      const { data, error } = await supabaseClient.from('user_settings').select('weather_location, layout_order, saved_links, later_links, calendar_url').eq('user_id', currentUser.id).maybeSingle();
      if (error) console.warn('同期データの読み込みに失敗しました。Supabaseの列追加を確認してください。', error);
      if (!data) {
        await syncUserSettings();
        return;
      }
      if (data?.weather_location) {
        weatherLocation = data.weather_location;
        localStorage.setItem('liquid-deck-weather-location', JSON.stringify(weatherLocation));
      }
      syncedLayoutOrder = data?.layout_order;
      applyLayoutOrder(syncedLayoutOrder);
      if (Array.isArray(data?.saved_links)) { savedLinks = data.saved_links; localStorage.setItem('liquid-deck-saved-links', JSON.stringify(savedLinks)); renderLinkList('saved'); }
      if (Array.isArray(data?.later_links)) { laterLinks = data.later_links; localStorage.setItem('liquid-deck-later-links', JSON.stringify(laterLinks)); renderLinkList('later'); }
      if (typeof data?.calendar_url === 'string') { calendarUrl = data.calendar_url; localStorage.setItem('liquid-deck-calendar-url', calendarUrl); loadCalendarEvent(); }
    };
    const syncUserSettings = async () => {
      if (!currentUser || !supabaseClient) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: currentUser.id, weather_location: weatherLocation, layout_order: [...grid.children].map((item) => item.dataset.slot), saved_links: savedLinks, later_links: laterLinks, calendar_url: calendarUrl, updated_at: new Date().toISOString() });
      if (error) console.warn('user_settings同期に失敗しました。SQLの列追加を確認してください。', error);
    };
    authButton.addEventListener('click', async () => {
      if (!supabaseClient) return;
      if (currentUser) { await supabaseClient.auth.signOut(); currentUser = null; authButton.textContent = 'login'; return; }
      await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: hostedAppUrl } });
    });
    const weatherIcons = {
      clearDay: './assets/weather/clear-day.png', clearNight: './assets/weather/clear-night.png', partlyCloudy: './assets/weather/partly-cloudy.png',
      cloudy: './assets/weather/cloudy.png', fog: './assets/weather/fog.png', lightRain: './assets/weather/light-rain.png', rain: './assets/weather/rain.png', heavyRain: './assets/weather/heavy-rain.png',
      snow: './assets/weather/snow.png', heavySnow: './assets/weather/heavy-snow.png', thunderstorm: './assets/weather/thunderstorm.png'
    };
    const iconForWeather = (code, isDay) => {
      if (code === 0) return isDay ? weatherIcons.clearDay : weatherIcons.clearNight;
      if ([1, 2].includes(code)) return weatherIcons.partlyCloudy;
      if (code === 3) return weatherIcons.cloudy;
      if ([45, 48].includes(code)) return weatherIcons.fog;
      if ([51, 53, 55, 56, 57, 80].includes(code)) return weatherIcons.lightRain;
      if ([61, 63, 66, 81].includes(code)) return weatherIcons.rain;
      if ([65, 67, 82].includes(code)) return weatherIcons.heavyRain;
      if ([71, 73, 77, 85].includes(code)) return weatherIcons.snow;
      if ([75, 86].includes(code)) return weatherIcons.heavySnow;
      if ([95, 96, 99].includes(code)) return weatherIcons.thunderstorm;
      return isDay ? weatherIcons.clearDay : weatherIcons.clearNight;
    };
    const loadWeather = async () => {
      try {
        const params = new URLSearchParams({ latitude: weatherLocation.latitude, longitude: weatherLocation.longitude, current: 'temperature_2m,weather_code,is_day', timezone: 'auto' });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('weather request failed');
        const data = await response.json();
        weatherTemp.textContent = `${Math.round(data.current.temperature_2m)}℃`;
        weatherIcon.src = iconForWeather(data.current.weather_code, data.current.is_day === 1);
        weatherIcon.alt = `${weatherLocation.name}の天気`;
      } catch (error) {
        weatherTemp.textContent = '--℃';
      }
    };
    const openWeather = () => { weatherTitle.textContent = `地域を選択（現在：${weatherLocation.name}）`; weatherModal.classList.add('open'); weatherModal.setAttribute('aria-hidden', 'false'); weatherInput.focus(); };
    const closeWeather = () => { weatherModal.classList.remove('open'); weatherModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('[data-action="weather"]').addEventListener('click', openWeather);
    document.querySelector('#weather-close').addEventListener('click', closeWeather);
    weatherInput.addEventListener('input', async () => {
      const query = weatherInput.value.trim();
      if (query.length < 2) { weatherResults.replaceChildren(); return; }
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ja&format=json`);
      const data = await response.json();
      weatherResults.replaceChildren(...(data.results || []).map((place) => {
        const button = document.createElement('button');
        button.className = 'weather-result';
        button.type = 'button';
        button.textContent = [place.name, place.admin1, place.country].filter(Boolean).join(' / ');
        button.addEventListener('click', () => {
          weatherLocation = { name: place.name, latitude: place.latitude, longitude: place.longitude };
          localStorage.setItem('liquid-deck-weather-location', JSON.stringify(weatherLocation));
          syncUserSettings();
          closeWeather();
          loadWeather();
        });
        return button;
      }));
    });
    weatherModal.addEventListener('click', (event) => { if (event.target === weatherModal) closeWeather(); });
    const scheduleWeatherRefresh = () => {
      clearInterval(weatherRefreshTimer);
      weatherRefreshTimer = setInterval(loadWeather, weatherRefreshMinutes * 60 * 1000);
    };
    loadWeather();
    scheduleWeatherRefresh();

    const speedModal = document.querySelector('#speed-modal');
    const speedStatus = document.querySelector('#speed-status');
    const openSpeed = () => { speedModal.classList.add('open'); speedModal.setAttribute('aria-hidden', 'false'); };
    const closeSpeed = () => { speedModal.classList.remove('open'); speedModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('[data-action="speed"]').addEventListener('click', openSpeed);
    document.querySelector('#speed-close').addEventListener('click', closeSpeed);
    speedModal.addEventListener('click', (event) => { if (event.target === speedModal) closeSpeed(); });
    document.querySelector('#speed-start').addEventListener('click', async () => {
      const setResult = (id, value) => { document.querySelector(id).textContent = value; };
      speedStatus.textContent = '測定中…';
      try {
        const pingTimes = [];
        for (let i = 0; i < 3; i += 1) {
          const start = performance.now();
          await fetch(`https://speed.cloudflare.com/__down?bytes=0&cb=${Date.now()}-${i}`, { cache: 'no-store' });
          pingTimes.push(performance.now() - start);
        }
        const ping = Math.round(pingTimes.reduce((sum, value) => sum + value, 0) / pingTimes.length);
        const downloadStart = performance.now();
        const downloadResponse = await fetch(`https://speed.cloudflare.com/__down?bytes=5000000&cb=${Date.now()}`, { cache: 'no-store' });
        const downloadData = await downloadResponse.arrayBuffer();
        const downloadMbps = (downloadData.byteLength * 8 / ((performance.now() - downloadStart) / 1000) / 1000000).toFixed(1);
        const uploadData = new Uint8Array(1000000);
        const uploadStart = performance.now();
        await fetch(`https://speed.cloudflare.com/__up?cb=${Date.now()}`, { method: 'POST', body: uploadData, cache: 'no-store' });
        const uploadMbps = (uploadData.byteLength * 8 / ((performance.now() - uploadStart) / 1000) / 1000000).toFixed(1);
        let ip = '--';
        try { ip = (await (await fetch('https://api64.ipify.org?format=json', { cache: 'no-store' })).json()).ip; } catch {}
        setResult('#speed-download', `${downloadMbps} Mbps`);
        setResult('#speed-upload', `${uploadMbps} Mbps`);
        setResult('#speed-ping', `${ping} ms`);
        setResult('#speed-ip', ip);
        speedStatus.textContent = '測定完了';
      } catch (error) {
        speedStatus.textContent = '測定に失敗しました。通信状態を確認してください。';
      }
    });

    const settingsModal = document.querySelector('#settings-modal');
    const settingsAuth = document.querySelector('#settings-auth');
    const clockFormatSelect = document.querySelector('#clock-format');
    const weatherIntervalSelect = document.querySelector('#weather-interval');
    const themeToggle = document.querySelector('#theme-toggle');
    const updateThemeButton = () => { themeToggle.textContent = darkMode ? 'light' : 'dark'; };
    updateThemeButton();
    themeToggle.addEventListener('click', () => { darkMode = !darkMode; document.body.classList.toggle('dark-mode', darkMode); localStorage.setItem('liquid-deck-dark-mode', darkMode ? '1' : '0'); updateThemeButton(); });
    // よく使うサイト・後で見るの一覧。通常リンクは端末保存、ログイン中はSupabaseにも同期します。
    const linkModalInfo = {
      saved: { modal: document.querySelector('#links-modal'), list: document.querySelector('#links-list'), title: document.querySelector('#links-title-input'), url: document.querySelector('#links-url-input') },
      later: { modal: document.querySelector('#later-modal'), list: document.querySelector('#later-list'), title: document.querySelector('#later-title-input'), url: document.querySelector('#later-url-input') }
    };
    // スマホでは「youtube.com」のように入力されることが多いため、https://を自動補完します。
    const normalizeUrl = (value) => {
      const text = value.trim();
      if (!text) return null;
      try { return new URL(/^https?:\/\//i.test(text) ? text : `https://${text}`).href; } catch { return null; }
    };
    const faviconFor = (url) => { try { return `https://icons.duckduckgo.com/ip3/${new URL(url).hostname}.ico`; } catch { return './リンク.png'; } };
    const renderLinkList = (kind) => {
      const info = linkModalInfo[kind]; const items = kind === 'saved' ? savedLinks : laterLinks; info.list.replaceChildren();
      if (!items.length) { info.list.innerHTML = '<span class="link-empty">まだ登録されていません。</span>'; return; }
      items.forEach((item, index) => {
        const row = document.createElement('div'); row.className = 'saved-link';
        const image = document.createElement('img'); image.src = item.iconUrl || faviconFor(item.url); image.alt = '';
        const details = document.createElement('div'); const link = document.createElement('a'); link.href = item.url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = item.title || item.url; const small = document.createElement('small'); small.textContent = item.url; details.append(link, small);
        const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '削除'; remove.addEventListener('click', () => { items.splice(index, 1); localStorage.setItem(kind === 'saved' ? 'liquid-deck-saved-links' : 'liquid-deck-later-links', JSON.stringify(items)); renderLinkList(kind); syncUserSettings(); });
        row.append(image, details, remove); info.list.append(row);
      });
    };
    const openLinkModal = (kind) => { const info = linkModalInfo[kind]; info.modal.classList.add('open'); info.modal.setAttribute('aria-hidden', 'false'); renderLinkList(kind); info.title.focus(); };
    const closeLinkModal = (kind) => { const modal = linkModalInfo[kind].modal; modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); };
    ['saved', 'later'].forEach((kind) => {
      const info = linkModalInfo[kind]; const action = kind === 'saved' ? 'links' : 'later'; const prefix = kind === 'saved' ? 'links' : 'later';
      document.querySelector(`[data-action="${action}"]`).addEventListener('click', () => openLinkModal(kind)); document.querySelector(`#${prefix}-close`).addEventListener('click', () => closeLinkModal(kind));
      info.modal.addEventListener('click', (event) => { if (event.target === info.modal) closeLinkModal(kind); });
      document.querySelector(`#${prefix}-add`).addEventListener('click', () => { const title = info.title.value.trim(); const url = normalizeUrl(info.url.value); if (!url) { info.url.focus(); return; } const item = { title: title || url, url, iconUrl: faviconFor(url) }; const items = kind === 'saved' ? savedLinks : laterLinks; items.push(item); localStorage.setItem(kind === 'saved' ? 'liquid-deck-saved-links' : 'liquid-deck-later-links', JSON.stringify(items)); info.title.value = ''; info.url.value = ''; renderLinkList(kind); syncUserSettings(); });
      info.title.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); info.url.focus(); } });
      info.url.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); document.querySelector(`#${prefix}-add`).click(); } });
    });
    renderLinkList('saved'); renderLinkList('later');

    const calendarDate = document.querySelector('#calendar-date');
    const calendarTime = document.querySelector('#calendar-time');
    const calendarEvent = document.querySelector('#calendar-event');
    const calendarModal = document.querySelector('#calendar-modal');
    const calendarInput = document.querySelector('#calendar-url');
    const calendarStatus = document.querySelector('#calendar-status');
    const calendarProxyUrl = 'https://mmxyzwydhewswlfpragp.supabase.co/functions/v1/smooth-task';
    const unfoldIcs = (text) => text.replace(/\r?\n[ \t]/g, '').replace(/\\,/g, ',').replace(/\\n/g, ' ');
    const parseCalendar = (text) => {
      const events = []; const blocks = unfoldIcs(text).split('BEGIN:VEVENT').slice(1);
      blocks.forEach((block) => { const start = block.match(/(?:^|\n)DTSTART(?:;[^:]*)?:([^\n]+)/)?.[1]; const title = block.match(/(?:^|\n)SUMMARY:([^\n]+)/)?.[1]; if (!start || !title) return; const value = start.trim(); const utc = value.endsWith('Z'); const year = Number(value.slice(0, 4)); const month = Number(value.slice(4, 6)) - 1; const day = Number(value.slice(6, 8)); const hour = Number(value.slice(9, 11) || 0); const minute = Number(value.slice(11, 13) || 0); const date = utc ? new Date(Date.UTC(year, month, day, hour, minute)) : new Date(year, month, day, hour, minute); if (date >= new Date()) events.push({ date, title }); });
      return events.sort((a, b) => a.date - b.date)[0];
    };
    const loadCalendarEvent = async () => {
      if (!calendarUrl) { calendarDate.textContent = '--/--'; calendarTime.textContent = '--:--'; calendarEvent.textContent = 'カレンダー未設定'; return; }
      if (calendarCache?.url === calendarUrl && Date.now() - calendarCache.savedAt < 10 * 60 * 1000) {
        calendarDate.textContent = calendarCache.date; calendarTime.textContent = calendarCache.time; calendarEvent.textContent = calendarCache.title; return;
      }
      try {
        const response = await fetch(calendarProxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_TWHw1Fc_r1OLBNUW47O0-w_fCxcC68S', Authorization: 'Bearer sb_publishable_TWHw1Fc_r1OLBNUW47O0-w_fCxcC68S' }, body: JSON.stringify({ url: calendarUrl }), cache: 'no-store' });
        if (!response.ok) throw new Error(`calendar proxy returned ${response.status}`);
        const event = parseCalendar(await response.text()); if (!event) throw new Error('no event');
        calendarDate.textContent = new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(event.date);
        calendarTime.textContent = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(event.date);
        calendarEvent.textContent = event.title;
        calendarCache = { url: calendarUrl, date: calendarDate.textContent, time: calendarTime.textContent, title: calendarEvent.textContent, savedAt: Date.now() };
        localStorage.setItem('liquid-deck-calendar-cache', JSON.stringify(calendarCache));
        calendarStatus.textContent = '';
      } catch (error) { console.error('カレンダー取得エラー:', error); if (calendarCache?.url === calendarUrl) { calendarDate.textContent = calendarCache.date; calendarTime.textContent = calendarCache.time; calendarEvent.textContent = calendarCache.title; } else calendarEvent.textContent = '予定を取得できません'; calendarStatus.textContent = `取得失敗（${error.message}）。しばらく待って再試行してください。`; }
    };
    document.querySelector('[data-action="calendar"]').addEventListener('click', () => { calendarInput.value = calendarUrl; calendarModal.classList.add('open'); calendarModal.setAttribute('aria-hidden', 'false'); calendarInput.focus(); });
    const closeCalendar = () => { calendarModal.classList.remove('open'); calendarModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('#calendar-close').addEventListener('click', closeCalendar);
    calendarModal.addEventListener('click', (event) => { if (event.target === calendarModal) closeCalendar(); });
    document.querySelector('#calendar-save').addEventListener('click', () => { const value = normalizeUrl(calendarInput.value); if (!value) { calendarInput.focus(); return; } calendarUrl = value; localStorage.setItem('liquid-deck-calendar-url', calendarUrl); syncUserSettings(); loadCalendarEvent(); closeCalendar(); });
    loadCalendarEvent();

    // どのダイアログでもEscキーで閉じられるようにします。
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      const modal = document.querySelector('.qr-modal.open, .weather-modal.open, .speed-modal.open, .settings-modal.open, .link-modal.open');
      if (!modal) return;
      modal.querySelector('button[id$="-close"]')?.click();
    });

    const openSettings = () => {
      settingsAuth.textContent = currentUser ? 'logout' : 'login';
      clockFormatSelect.value = clockFormat;
      weatherIntervalSelect.value = String(weatherRefreshMinutes);
      settingsModal.classList.add('open');
      settingsModal.setAttribute('aria-hidden', 'false');
    };
    const closeSettings = () => { settingsModal.classList.remove('open'); settingsModal.setAttribute('aria-hidden', 'true'); };
    document.querySelector('[data-action="settings"]').addEventListener('click', openSettings);
    document.querySelector('#settings-close').addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', (event) => { if (event.target === settingsModal) closeSettings(); });
    settingsAuth.addEventListener('click', () => { authButton.click(); });
    clockFormatSelect.addEventListener('change', () => { clockFormat = clockFormatSelect.value; localStorage.setItem('liquid-deck-clock-format', clockFormat); updateClock(); });
    weatherIntervalSelect.addEventListener('change', () => { weatherRefreshMinutes = Number(weatherIntervalSelect.value); localStorage.setItem('liquid-deck-weather-interval', String(weatherRefreshMinutes)); scheduleWeatherRefresh(); });
    document.querySelector('#reset-layout').addEventListener('click', () => {
      [...grid.children].sort((a, b) => Number(a.dataset.slot) - Number(b.dataset.slot)).forEach((button) => grid.appendChild(button));
      localStorage.removeItem('liquid-deck-order');
      syncUserSettings();
    });
    supabaseClient?.auth.onAuthStateChange((_event, session) => {
      updateAuthButton(session);
      settingsAuth.textContent = session?.user ? 'logout' : 'login';
      if (session) setTimeout(() => loadSyncedWeatherLocation().then(() => loadWeather()), 0);
    });

    // 編集モードで並べ替えた順番を保存します。
    const buttons = [...grid.querySelectorAll('.button')];
    buttons.forEach((button, index) => { button.dataset.slot = String(index); });
    const savedOrder = JSON.parse(localStorage.getItem('liquid-deck-order') || 'null');
    applyLayoutOrder(syncedLayoutOrder || savedOrder);

    let draggedButton = null;
    let dragStartX = 0;
    let dragStartY = 0;
    editMode.addEventListener('change', () => {
      grid.querySelectorAll('.button').forEach((button) => button.classList.toggle('editable', editMode.checked));
    });
    grid.addEventListener('pointerdown', (event) => {
      if (!editMode.checked) return;
      const button = event.target.closest('.button');
      if (!button) return;
      event.preventDefault();
      draggedButton = button;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      draggedButton.classList.add('dragging');
      draggedButton.setPointerCapture(event.pointerId);
    });
    grid.addEventListener('pointermove', (event) => {
      if (!draggedButton) return;
      const x = event.clientX - dragStartX;
      const y = event.clientY - dragStartY;
      draggedButton.style.transform = `translate(${x}px, ${y}px) scale(.96)`;
    });
    grid.addEventListener('pointerup', (event) => {
      if (!draggedButton) return;
      const target = document.elementsFromPoint(event.clientX, event.clientY)
        .map((element) => element.closest('.button'))
        .find((button) => button && button !== draggedButton && button.parentElement === grid);
      if (target && target !== draggedButton && target.parentElement === grid) {
        // ドロップ先と掴んだボタンの2つだけを直接交換します。
        const placeholder = document.createElement('span');
        placeholder.hidden = true;
        grid.replaceChild(placeholder, draggedButton);
        grid.replaceChild(draggedButton, target);
        grid.replaceChild(target, placeholder);
        localStorage.setItem('liquid-deck-order', JSON.stringify([...grid.children].map((item) => item.dataset.slot)));
        syncUserSettings();
      }
      draggedButton.classList.remove('dragging');
      draggedButton.style.transform = '';
      draggedButton.releasePointerCapture?.(event.pointerId);
      draggedButton = null;
    });
    const cancelDrag = () => {
      if (!draggedButton) return;
      draggedButton.classList.remove('dragging');
      draggedButton.style.transform = '';
      draggedButton = null;
    };
    grid.addEventListener('pointercancel', cancelDrag);
    grid.addEventListener('lostpointercapture', cancelDrag);
    // 画面とローカル並び順の初期化が終わってからクラウド設定を読み込みます。
    loadSyncedWeatherLocation().then(() => loadWeather());
  </script>
</body>
</html>
