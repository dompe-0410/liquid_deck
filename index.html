<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f8fc" />
  <title>Liquid Deck</title>
  <style>
    :root {
      /* Main visual controls: adjust these values to tune the material. */
      --page-background: #f3f7fb;
      --page-glow-a: rgba(181, 229, 255, .62);
      --page-glow-b: rgba(222, 207, 255, .52);
      --page-text: #274052;
      --muted-text: #7890a0;
      --accent-color: #56bde9;
      --display-color: rgba(232, 247, 255, .64);
      --display-line: rgba(255, 255, 255, .84);
      --key-background: rgba(255, 255, 255, .38);
      --key-background-hover: rgba(255, 255, 255, .55);
      --key-border: rgba(255, 255, 255, .86);
      --key-radius: 18px;
      --key-blur: 16px;
      --key-shadow: 0 14px 24px rgba(89, 119, 142, .16), 0 3px 6px rgba(89, 119, 142, .08), inset 0 1px rgba(255,255,255,.9);
      --key-shadow-pressed: 0 5px 9px rgba(89, 119, 142, .12), inset 0 3px 9px rgba(117, 166, 188, .12);
      --grid-gap: clamp(10px, 2.6vw, 20px);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--page-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-background);
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      width: 48vw;
      height: 48vw;
      border-radius: 50%;
      content: "";
      filter: blur(35px);
      pointer-events: none;
    }
    body::before { top: -18vw; left: -12vw; background: var(--page-glow-a); }
    body::after { right: -15vw; bottom: -20vw; background: var(--page-glow-b); }

    .deck { width: min(92vw, 760px); padding: clamp(16px, 4vw, 32px); }
    .deck-header { display: flex; align-items: end; justify-content: space-between; margin: 0 3px 22px; }
    h1 { margin: 0; color: #31546a; font-size: clamp(1.35rem, 4vw, 2rem); font-weight: 650; letter-spacing: .06em; }
    .status { color: var(--muted-text); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }

    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--grid-gap); }
    .button {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .display {
      position: absolute;
      inset: 6px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      overflow: hidden;
      border: 1px solid var(--display-line);
      border-radius: calc(var(--key-radius) - 4px);
      background: linear-gradient(145deg, rgba(255,255,255,.66), var(--display-color));
      box-shadow: inset 0 0 18px rgba(255,255,255,.42), inset 0 -8px 18px rgba(108, 188, 219, .08);
    }
    .display::after { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.42), transparent 42%); content: ""; pointer-events: none; }
    .cap {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 10px;
      border: 1px solid var(--key-border);
      border-radius: var(--key-radius);
      background: linear-gradient(145deg, rgba(255,255,255,.40), var(--key-background));
      box-shadow: var(--key-shadow);
      backdrop-filter: blur(var(--key-blur));
      -webkit-backdrop-filter: blur(var(--key-blur));
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    .button:hover .cap { background: linear-gradient(145deg, rgba(255,255,255,.54), var(--key-background-hover)); border-color: #fff; }
    .button:active .cap { transform: translateY(4px) scale(.975); box-shadow: var(--key-shadow-pressed); }
    .button:focus-visible .cap { outline: 3px solid rgba(86,189,233,.38); outline-offset: 4px; }
    .icon { position: relative; z-index: 2; color: #3f7189; font-size: clamp(1.25rem, 5vw, 2.15rem); line-height: 1; }
    .label { position: relative; z-index: 2; max-width: 100%; overflow: hidden; color: #476a7c; font-size: clamp(.62rem, 2vw, .82rem); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .value { position: relative; z-index: 2; color: var(--accent-color); font-size: clamp(.62rem, 2.2vw, 1rem); font-variant-numeric: tabular-nums; }
    .empty .display { background: rgba(255,255,255,.25); box-shadow: inset 0 0 14px rgba(255,255,255,.48); }
    .empty .cap { background: rgba(255,255,255,.22); opacity: .82; }

    @media (max-width: 420px) { .deck { width: 96vw; padding: 12px; } .deck-header { margin-bottom: 16px; } }
    @media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
  </style>
</head>
<body>
  <main class="deck">
    <header class="deck-header"><h1>Liquid Deck</h1><span class="status">prototype</span></header>
    <section class="grid" aria-label="Liquid Deck buttons">
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">◷</span><span class="label">時計</span><span class="value" id="clock">--:--</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">☀</span><span class="label">天気</span><span class="value">準備中</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">▣</span><span class="label">QR作成</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">↗</span><span class="label">サイト</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">▤</span><span class="label">カレンダー</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">⌁</span><span class="label">速度テスト</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">◫</span><span class="label">後で見る</span></span></button>
      <button class="button"><span class="display"></span><span class="cap"><span class="icon">⚙</span><span class="label">設定</span></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
      <button class="button empty" aria-label="未使用"><span class="display"></span><span class="cap"></span></button>
    </section>
  </main>
  <script>
    const clock = document.querySelector('#clock');
    const updateClock = () => { clock.textContent = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date()); };
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
